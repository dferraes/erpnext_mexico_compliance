name: Docker Image CI

on:
  pull_request:
    branches: ["main"]
    types:
      - closed

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Build apps.json
        run: |
          jq -ce --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" '
            map(if .url == "%s REPO_URL" then .url = $url | .branch = "main" else . end)
          ' docker/apps.json > "$RUNNER_TEMP/apps.json"
          printf 'APPS_JSON_BASE64=%s\n' "$(base64 --wrap=0 "$RUNNER_TEMP/apps.json")" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to DockerHub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker
          file: ./docker/Containerfile
          push: true
          build-args: |
            APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16

          tags: |
            ahuahuachi/erpnext_mexico_compliance:latest
