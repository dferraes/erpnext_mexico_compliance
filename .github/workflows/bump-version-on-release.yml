name: Bump version on release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag (e.g. v0.13.4)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: version-16
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z._+!-]*$ ]]; then
            echo "::error::El tag no contiene una versión de paquete válida"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Merge main into version-16
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit || {
            echo "Merge conflict detected. Resolve manually on version-16 branch."
            exit 1
          }

      - name: Update __init__.py
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^__version__ = \".*\"$/__version__ = \"$PACKAGE_VERSION\"/" \
            erpnext_mexico_compliance/__init__.py

      - name: Commit and push
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add erpnext_mexico_compliance/__init__.py
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump version to $PACKAGE_VERSION"
          git push
